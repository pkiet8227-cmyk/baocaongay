<!doctype html>

<html lang="vi">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Quản Lý Báo Cáo Ngày
  </title>


  <link
    rel="stylesheet"
    href="style.css"
  >


  <style>

    /* ========================================================
       RESET
    ======================================================== */

    * {
      box-sizing: border-box;
    }


    html {
      scroll-behavior: smooth;
    }


    body {
      margin: 0;
      padding: 0;
    }


    body.menu-open {
      overflow: hidden;
    }


    /* ========================================================
       HEADER
    ======================================================== */

    .manager-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 20px;
    }


    .header {
      display: flex;
      align-items: center;
      gap: 12px;
    }


    .header h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 800;
    }


    .header p {
      margin: 4px 0 0;
      opacity: 0.7;
    }


    .logo {
      font-size: 36px;
    }


    /* ========================================================
       MENU BUTTON
    ======================================================== */

    .menu-button {
      width: 46px;
      height: 46px;

      border: 0;
      border-radius: 12px;

      background: #111827;
      color: white;

      font-size: 23px;

      cursor: pointer;

      display: flex;
      align-items: center;
      justify-content: center;
    }


    .menu-button:hover {
      opacity: 0.85;
    }


    /* ========================================================
       SIDE MENU
    ======================================================== */

    .side-menu-overlay {
      position: fixed;
      inset: 0;

      background: rgba(0,0,0,0.45);

      opacity: 0;
      visibility: hidden;

      transition: 0.25s;

      z-index: 9998;
    }


    .side-menu-overlay.show {
      opacity: 1;
      visibility: visible;
    }


    .side-menu {
      position: fixed;

      top: 0;
      left: 0;

      width: 310px;
      max-width: 85vw;
      height: 100vh;

      background: white;

      transform: translateX(-100%);

      transition: 0.3s;

      z-index: 9999;

      box-shadow:
        8px 0 30px rgba(0,0,0,0.18);

      padding: 20px;
    }


    .side-menu.open {
      transform: translateX(0);
    }


    .side-menu-header {
      display: flex;
      justify-content: space-between;
      align-items: center;

      margin-bottom: 25px;
    }


    .side-menu-header h2 {
      margin: 0;
      font-size: 20px;
    }


    .side-menu-close {
      border: 0;
      background: transparent;

      font-size: 25px;

      cursor: pointer;
    }


    .side-menu button {
      width: 100%;

      padding: 14px;

      margin-bottom: 10px;

      border: 0;
      border-radius: 10px;

      text-align: left;

      font-size: 15px;
      font-weight: 700;

      cursor: pointer;
    }


    #menuReportsBtn {
      background: #eef2ff;
      color: #3730a3;
    }


    #menuLogoutBtn {
      background: #fee2e2;
      color: #b91c1c;
    }


    /* ========================================================
       LOGIN
    ======================================================== */

    #loginBox {
      max-width: 480px;
      margin: 20px auto;
    }


    .login-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }


    .login-form label {
      font-weight: 700;
    }


    .login-form input {
      width: 100%;

      padding: 13px 14px;

      border: 1px solid #d1d5db;

      border-radius: 10px;

      font-size: 16px;
    }


    #loginBtn {
      width: 100%;

      padding: 13px;

      border: 0;
      border-radius: 10px;

      background: #2563eb;
      color: white;

      font-size: 16px;
      font-weight: 800;

      cursor: pointer;
    }


    #loginBtn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }


    #loginMessage {
      margin-top: 12px;
      font-weight: 700;
    }


    /* ========================================================
       STATS
    ======================================================== */

    .stats {
      display: grid;

      grid-template-columns:
        repeat(2, minmax(0, 1fr));

      gap: 15px;

      margin-bottom: 22px;
    }


    .stat-box {
      padding: 20px;

      border-radius: 14px;

      background: #f8fafc;

      border: 1px solid #e5e7eb;
    }


    .stat-title {
      font-size: 14px;
      opacity: 0.7;
      margin-bottom: 6px;
    }


    .stat-value {
      font-size: 25px;
      font-weight: 900;
    }


    /* ========================================================
       SECTION TITLE
    ======================================================== */

    .section-title {
      margin: 18px 0 10px;

      font-size: 18px;
      font-weight: 900;
    }


    /* ========================================================
       FILTER
    ======================================================== */

    .filters {
      display: flex;

      flex-wrap: wrap;

      gap: 10px;

      align-items: center;

      margin-bottom: 20px;
    }


    .filters label {
      font-weight: 700;
    }


    .filters input {
      min-height: 42px;

      padding: 9px 11px;

      border:
        1px solid #d1d5db;

      border-radius: 9px;

      font-size: 14px;
    }


    .filters button {
      min-height: 42px;

      padding:
        9px 14px;

      border: 0;

      border-radius: 9px;

      font-weight: 800;

      cursor: pointer;
    }


    .filters button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }


    /* ========================================================
       BUTTON COLORS
    ======================================================== */

    .danger {
      background: #dc2626 !important;
      color: white !important;
    }


    .green {
      background: #16a34a !important;
      color: white !important;
    }


    .gray {
      background: #64748b !important;
      color: white !important;
    }


    #exportBtn {
      background: #2563eb;
      color: white;
    }


    /* ========================================================
       DELETE ALL
    ======================================================== */

    #deleteAllBtn {
      background: #991b1b;

      color: white;

      border: 0;

      font-weight: 900;

      box-shadow:
        0 3px 10px rgba(153,27,27,0.25);
    }


    #deleteAllBtn:hover {
      background: #7f1d1d;
    }


    /* ========================================================
       TABLE
    ======================================================== */

    .table-wrap {
      width: 100%;

      overflow-x: auto;

      border:
        1px solid #e5e7eb;

      border-radius: 12px;

      background: white;
    }


    table {
      width: 100%;

      min-width: 1450px;

      border-collapse: collapse;
    }


    th,
    td {
      padding:
        11px 10px;

      border-bottom:
        1px solid #e5e7eb;

      text-align: left;

      vertical-align: top;

      font-size: 14px;
    }


    th {
      background: #f1f5f9;

      font-weight: 900;

      white-space: nowrap;

      position: sticky;
      top: 0;

      z-index: 1;
    }


    tbody tr:hover {
      background: #f8fafc;
    }


    .detail-cell {
      min-width: 220px;

      white-space: pre-wrap;

      word-break: break-word;
    }


    .money-cell {
      text-align: right;

      white-space: nowrap;

      font-weight: 700;
    }


    .action-cell {
      white-space: nowrap;

      width: 90px;
    }


    /* ========================================================
       ACTION BUTTONS
    ======================================================== */

    .edit-btn,
    .delete-btn {
      width: 34px;
      height: 34px;

      padding: 0;

      border: 0;

      border-radius: 8px;

      cursor: pointer;

      margin-right: 4px;

      font-size: 16px;
    }


    .edit-btn {
      background: #dbeafe;
    }


    .delete-btn {
      background: #fee2e2;
    }


    .edit-btn:hover,
    .delete-btn:hover {
      transform: scale(1.05);
    }


    /* ========================================================
       EMPTY
    ======================================================== */

    .empty-row {
      text-align: center;

      padding: 40px !important;

      color: #64748b;

      font-weight: 700;
    }


    /* ========================================================
       MESSAGE
    ======================================================== */

    #managerMessage {
      margin-top: 15px;

      padding: 10px;

      font-weight: 700;
    }


    /* ========================================================
       PAGINATION
    ======================================================== */

    #pagination {
      margin-top: 18px;
    }


    .pagination-wrap {
      display: flex;

      justify-content: center;

      align-items: center;

      gap: 12px;
    }


    .pagination-wrap button {
      border: 0;

      padding:
        9px 14px;

      border-radius: 8px;

      background: #e2e8f0;

      font-weight: 800;

      cursor: pointer;
    }


    .pagination-wrap button:disabled {
      opacity: 0.45;

      cursor: not-allowed;
    }


    .page-info {
      font-weight: 800;
    }


    /* ========================================================
       MODAL
    ======================================================== */

    .modal-overlay {
      position: fixed;

      inset: 0;

      background:
        rgba(0,0,0,0.5);

      z-index: 10000;

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 20px;

      overflow-y: auto;
    }


    .edit-modal,
    .submitted-modal {
      width: 100%;

      max-width: 700px;

      background: white;

      border-radius: 16px;

      box-shadow:
        0 20px 60px
        rgba(0,0,0,0.25);

      overflow: hidden;
    }


    .edit-modal-header,
    .submitted-modal-header {
      display: flex;

      justify-content: space-between;

      align-items: flex-start;

      padding: 18px 20px;

      border-bottom:
        1px solid #e5e7eb;
    }


    .edit-modal-header h2,
    .submitted-modal-header h2 {
      margin: 0;

      font-size: 20px;
    }


    .edit-modal-header p,
    .submitted-modal-header p {
      margin: 5px 0 0;

      color: #64748b;
    }


    .modal-close {
      border: 0;

      background: transparent;

      font-size: 23px;

      cursor: pointer;
    }


    /* ========================================================
       EDIT FORM
    ======================================================== */

    .edit-form {
      display: grid;

      grid-template-columns:
        repeat(2, minmax(0, 1fr));

      gap: 14px;

      padding: 20px;

      max-height: 65vh;

      overflow-y: auto;
    }


    .edit-form label {
      display: flex;

      flex-direction: column;

      gap: 6px;

      font-weight: 800;
    }


    .edit-form input,
    .edit-form select,
    .edit-form textarea {
      width: 100%;

      padding: 10px 11px;

      border:
        1px solid #d1d5db;

      border-radius: 9px;

      font-family: inherit;

      font-size: 14px;

      font-weight: 400;
    }


    .edit-form textarea {
      resize: vertical;
    }


    .edit-modal-footer {
      display: flex;

      justify-content: flex-end;

      gap: 10px;

      padding: 15px 20px;

      border-top:
        1px solid #e5e7eb;
    }


    .edit-modal-footer button {
      border: 0;

      border-radius: 9px;

      padding:
        11px 15px;

      font-weight: 800;

      cursor: pointer;
    }


    .save-edit-btn {
      background: #16a34a;

      color: white;
    }


    /* ========================================================
       SUBMITTED USERS
    ======================================================== */

    .submitted-user-list {
      max-height: 60vh;

      overflow-y: auto;

      padding: 15px 20px;
    }


    .submitted-user-item {
      display: flex;

      align-items: center;

      gap: 10px;

      padding: 12px 0;

      border-bottom:
        1px solid #e5e7eb;
    }


    .submitted-number {
      width: 30px;

      font-weight: 900;

      color: #64748b;
    }


    .submitted-user-name {
      flex: 1;

      font-weight: 800;
    }


    .submitted-count {
      font-size: 13px;

      color: #64748b;
    }


    .submitted-empty {
      padding: 35px;

      text-align: center;

      color: #64748b;

      font-weight: 700;
    }


    /* ========================================================
       MOBILE
    ======================================================== */

    @media (max-width: 700px) {

      .header h1 {
        font-size: 18px;
      }


      .header p {
        font-size: 12px;
      }


      .logo {
        font-size: 28px;
      }


      .stats {
        grid-template-columns: 1fr;
      }


      .filters {
        flex-direction: column;

        align-items: stretch;
      }


      .filters label {
        margin-top: 5px;
      }


      .filters input,
      .filters button {
        width: 100%;
      }


      .edit-form {
        grid-template-columns: 1fr;
      }


      .edit-modal-footer {
        flex-direction: column;
      }


      .edit-modal-footer button {
        width: 100%;
      }


      .submitted-user-item {
        align-items: flex-start;
      }

    }


    #logoutBtn {
      display: none !important;
    }

  </style>

</head>


<body>


  <!-- ======================================================
       SIDE MENU OVERLAY
  ======================================================= -->

  <div
    id="sideMenuOverlay"
    class="side-menu-overlay">
  </div>


  <!-- ======================================================
       SIDE MENU
  ======================================================= -->

  <aside
    id="sideMenu"
    class="side-menu">

    <div class="side-menu-header">

      <h2>
        ☰ MENU
      </h2>

      <button
        id="sideMenuClose"
        class="side-menu-close"
        type="button">
        ✕
      </button>

    </div>


    <button
      id="menuReportsBtn"
      type="button">

      📊 Quản lý báo cáo

    </button>


    <button
      id="menuLogoutBtn"
      type="button">

      🚪 Đăng xuất

    </button>

  </aside>


  <!-- ======================================================
       MAIN
  ======================================================= -->

  <main class="container manager-card">

    <section class="card">


      <!-- ==================================================
           HEADER
      =================================================== -->

      <div class="manager-header">

        <button
          id="menuBtn"
          class="menu-button"
          type="button">

          ☰

        </button>


        <div class="header">

          <div class="logo">
            📊
          </div>


          <div>

            <h1>
              QUẢN LÝ BÁO CÁO NGÀY
            </h1>

            <p>
              Theo dõi và xuất báo cáo
            </p>

          </div>

        </div>

      </div>


      <!-- ==================================================
           LOGIN
      =================================================== -->

      <div
        id="loginBox">

        <div class="login-form">

          <label>
            Email quản lý
          </label>

          <input
            id="loginId"
            type="email"
            placeholder="Nhập email"
            autocomplete="username"
          >


          <label>
            Mật khẩu
          </label>

          <input
            id="password"
            type="password"
            placeholder="Nhập mật khẩu"
            autocomplete="current-password"
          >


          <button
            id="loginBtn"
            type="button">

            🔐 ĐĂNG NHẬP

          </button>


          <div
            id="loginMessage">
          </div>

        </div>

      </div>


      <!-- ==================================================
           MANAGER
      =================================================== -->

      <div
        id="managerBox"
        style="display:none;">


        <!-- Hidden logout -->
        <button
          id="logoutBtn"
          class="danger"
          type="button">

          🚪 ĐĂNG XUẤT

        </button>


        <!-- ==================================================
             STATS
        =================================================== -->

        <div class="stats">


          <div class="stat-box">

            <div class="stat-title">
              Tổng số báo cáo
            </div>

            <div
              id="totalReports"
              class="stat-value">
              0
            </div>

          </div>


          <div class="stat-box">

            <div class="stat-title">
              Tổng dự thu
            </div>

            <div
              id="totalAmount"
              class="stat-value">
              0 đ
            </div>

          </div>


        </div>


        <!-- ==================================================
             FILTER
        =================================================== -->

        <div class="section-title">
          🔎 BỘ LỌC
        </div>


        <div class="filters">


          <label for="filterUser">
            Lọc theo cán bộ
          </label>


          <input
            id="filterUser"
            type="text"
            placeholder="Nhập tên user cán bộ"
          >


          <label for="filterDate">
            Lọc theo ngày field
          </label>


          <input
            id="filterDate"
            type="date"
          >


          <button
            id="filterBtn"
            class="gray"
            type="button">

            🔎 LỌC DỮ LIỆU

          </button>


          <button
            id="refreshBtn"
            class="green"
            type="button">

            🔄 LÀM MỚI

          </button>


          <button
            id="exportBtn"
            type="button">

            📥 XUẤT EXCEL

          </button>


          <button
            id="showSubmittedUsersBtn"
            class="gray"
            type="button">

            👥 CÁN BỘ ĐÃ NHẬP BÁO CÁO
            (<span id="submittedUserCount">0</span>)

          </button>


          <!-- =================================================
               XÓA TOÀN BỘ
          ================================================== -->

          <button
            id="deleteAllBtn"
            class="danger"
            type="button">

            🗑️ XÓA TẤT CẢ

          </button>


        </div>


        <!-- ==================================================
             TABLE
        =================================================== -->

        <div class="table-wrap">

          <table>

            <thead>

              <tr>

                <th>
                  Cán bộ
                </th>

                <th>
                  Ngày field
                </th>

                <th>
                  Số CIF
                </th>

                <th>
                  Tên khách hàng
                </th>

                <th>
                  Kết quả
                </th>

                <th>
                  Kết nối
                </th>

                <th>
                  Kết quả chi tiết
                </th>

                <th>
                  Dự thu
                </th>

                <th>
                  Hướng tác động tiếp theo
                </th>

                <th>
                  Thao tác
                </th>

              </tr>

            </thead>


            <tbody id="tableBody">

            </tbody>

          </table>

        </div>


        <!-- ==================================================
             PAGINATION
        =================================================== -->

        <div
          id="pagination">
        </div>


        <!-- ==================================================
             MESSAGE
        =================================================== -->

        <div
          id="managerMessage">
        </div>


      </div>

    </section>

  </main>


  <!-- ======================================================
       SUPABASE
  ======================================================= -->

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
  </script>


  <!-- ======================================================
       XLSX
  ======================================================= -->

  <script
    src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js">
  </script>


  <!-- ======================================================
       CONFIG
  ======================================================= -->

  <script src="config.js"></script>


  <!-- ======================================================
       MANAGER JS
  ======================================================= -->

  <script src="manager.js"></script>


</body>

</html>
